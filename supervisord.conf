
[supervisord]
nodaemon=true

[program:mysql]
command=/usr/sbin/mysqld --user=mysql
autostart=true
autorestart=true
priority=10
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=20
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
