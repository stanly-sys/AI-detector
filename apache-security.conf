
# Reduce Apache server information
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Protect against slow HTTP requests
RequestReadTimeout header=20-40,MinRate=500 body=20-120,MinRate=500
ErrorDocument 413 /api/request-too-large.php

# Add security response headers
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

# Protect the public website directory
<Directory "/var/www/html">
    Options -Indexes
    AllowOverride None
    <LimitExcept GET POST HEAD>
        Require all denied
    </LimitExcept>
</Directory>

# Internal PHP includes must not be directly accessible
<Directory "/var/www/html/includes">
    Require all denied
</Directory>

# Block hidden and common backup files
<FilesMatch "(?i)(^\.|(\.bak|\.old|\.sql|\.log|\.ini|\.swp)$)">
    Require all denied
</FilesMatch>

# Keep application configuration, database dumps, and editor artifacts private.
<FilesMatch "(?i)(^\.env|\.dist$|\.conf$|\.cnf$|\.pem$|\.key$|\.sqlite3?$|\.dump$|~$)">
    Require all denied
</FilesMatch>

# Limit the HTTP request body for image analysis
<Directory "/var/www/html/api">
    <Files "analyze.php">
        LimitRequestBody 2300000
    </Files>
</Directory>
